name: Build Android APK & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Analyze, Test & Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze

      - name: Run unit & widget tests (Portrait 1080x2400)
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Copy APK with versioned names
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/wild-overdrive-v1.0.0.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/wild-v1.0.0.apk
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wild-overdrive-v1.0.0-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/wild-overdrive-v1.0.0.apk
            build/app/outputs/flutter-apk/wild-v1.0.0.apk
          if-no-files-found: error

      - name: Publish Android APK to GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" build/app/outputs/flutter-apk/wild-overdrive-v1.0.0.apk build/app/outputs/flutter-apk/wild-v1.0.0.apk build/app/outputs/flutter-apk/app-release.apk --clobber
          else
            gh release create "$TAG_NAME" build/app/outputs/flutter-apk/wild-overdrive-v1.0.0.apk build/app/outputs/flutter-apk/wild-v1.0.0.apk build/app/outputs/flutter-apk/app-release.apk --title "Wild Overdrive $TAG_NAME — Chaos Arcade Roguelite Android APK" --generate-notes
          fi
